<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nudge Relay - Устройство</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #202124; color: white; text-align: center; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; margin: 0; }
        .container { background: #2d2e31; padding: 30px; border-radius: 16px; width: 100%; max-width: 400px; box-sizing: border-box; }
        #deviceCode { font-family: monospace; font-size: 42px; font-weight: bold; color: #8ab4f8; }
        .btn { background: #34a853; color: white; border: none; padding: 15px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 20px; width: 100%; }
        .btn:disabled { background: #555; cursor: not-allowed; }
        .status { font-size: 14px; color: #9aa0a6; margin-top: 10px; }
        
        /* Стили для окна */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; justify-content: center; align-items: center; z-index: 1000; }
        .modal-content { background: white; color: #333; padding: 25px; border-radius: 12px; width: 90%; max-width: 350px; text-align: left; }
        .modal-header { display: flex; align-items: center; gap: 10px; color: #d93025; font-weight: bold; font-size: 18px; margin-bottom: 15px; }
        .modal-text { font-size: 16px; margin-bottom: 20px; background: #f8f9fa; padding: 10px; border-radius: 8px; border-left: 4px solid #d93025; }
        .modal-buttons { display: flex; gap: 10px; }
        .modal-buttons button { flex: 1; padding: 12px; border: none; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-reply { background: #4285f4; color: white; }
        .btn-ok { background: #e0e0e0; color: #333; }
        #replyInput { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 8px; display: none; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Это устройство</h1>
        <p class="status">Введите этот код на пульте</p>
        <div id="deviceCode" style="margin-bottom: 20px;">NR-XXXX</div>
        
        <button id="pushBtn" class="btn">Включить пуши</button>
        <p class="status" id="pushStatus"></p>
    </div>

    <div class="modal-overlay" id="errorModal">
        <div class="modal-content">
            <div class="modal-header">⚠️ Системное уведомление</div>
            <div class="modal-text" id="modalMessage"></div>
            <input type="text" id="replyInput" placeholder="Введите ответ...">
            <div class="modal-buttons">
                <button class="btn-reply" id="btnReply">Ответить</button>
                <button class="btn-ok" id="btnOk">ОК</button>
            </div>
        </div>
    </div>

<script type="module">
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.0.0/firebase-app.js';
    import { getDatabase, ref, set, push, onChildAdded } from 'https://www.gstatic.com/firebasejs/9.0.0/firebase-database.js';
    import { getMessaging, getToken } from 'https://www.gstatic.com/firebasejs/9.0.0/firebase-messaging.js';

    const firebaseConfig = {
        apiKey: "AIzaSyDgpS0FqB5b4oi7NTvdm9sHM0DVaPuxYuY",
        authDomain: "nudge-relay-3fce7.firebaseapp.com",
        databaseURL: "https://nudge-relay-3fce7-default-rtdb.europe-west1.firebasedatabase.app",
        projectId: "nudge-relay-3fce7",
        storageBucket: "nudge-relay-3fce7.firebasestorage.app",
        messagingSenderId: "533763167345",
        appId: "1:533763167345:web:6bdbc5786aaf7cb735b7d0"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    let deviceCode = localStorage.getItem('nr_device_code');
    if (!deviceCode) {
        deviceCode = `NR-${Math.floor(1000 + Math.random() * 9000)}`;
        localStorage.setItem('nr_device_code', deviceCode);
    }
    document.getElementById('deviceCode').textContent = deviceCode;

    // ВКЛЮЧЕНИЕ ПУШЕЙ
    document.getElementById('pushBtn').onclick = async () => {
        try {
            const permission = await Notification.requestPermission();
            if (permission === 'granted') {
                const messaging = getMessaging(app);
                // ВСТАВЬ СЮДА СВОЙ VAPID KEY (из Firebase -> Cloud Messaging -> Web Push certificates)
                const token = await getToken(messaging, { 
                    vapidKey: 'BEVDXwm530JAlQk_EaXp8Jx_5Ff91q8rvttRlrVP85qpwUL830OA25GmyalNx84iJ4QF6KLPt9FjAr0PgTmqXvA' 
                });
                
                if (token) {
                    await set(ref(db, 'tokens/' + deviceCode), token);
                    document.getElementById('pushStatus').textContent = "Уведомления включены!";
                    document.getElementById('pushBtn').disabled = true;
                    document.getElementById('pushBtn').textContent = "Пуш включен";
                }
            }
        } catch (e) {
            document.getElementById('pushStatus').textContent = "Ошибка: " + e.message;
        }
    };

    // ЛОГИКА ОКНА (работает когда вкладка открыта)
    const modal = document.getElementById('errorModal');
    const modalMessage = document.getElementById('modalMessage');
    const replyInput = document.getElementById('replyInput');
    const btnReply = document.getElementById('btnReply');
    const btnOk = document.getElementById('btnOk');

    btnOk.onclick = () => {
        modal.style.display = 'none';
        replyInput.style.display = 'none';
        replyInput.value = '';
        btnReply.textContent = 'Ответить';
    };

    btnReply.onclick = () => {
        if (replyInput.style.display === 'none' || replyInput.style.display === '') {
            replyInput.style.display = 'block';
            btnReply.textContent = 'Отправить';
            replyInput.focus();
        } else {
            const answer = replyInput.value.trim();
            if (answer) {
                push(ref(db, 'messages/' + deviceCode), {
                    text: answer, from: 'device', timestamp: Date.now()
                });
            }
            modal.style.display = 'none';
            replyInput.style.display = 'none';
            replyInput.value = '';
            btnReply.textContent = 'Ответить';
        }
    };

    let lastProcessed = parseInt(localStorage.getItem('nr_last_msg_' + deviceCode)) || 0;
    onChildAdded(ref(db, 'messages/' + deviceCode), (snapshot) => {
        const msg = snapshot.val();
        if (msg.from === 'commander' && msg.timestamp > lastProcessed) {
            lastProcessed = msg.timestamp;
            localStorage.setItem('nr_last_msg_' + deviceCode, lastProcessed);
            
            modalMessage.textContent = msg.text;
            modal.style.display = 'flex';
            replyInput.style.display = 'none';
            btnReply.textContent = 'Ответить';
        }
    });
</script>
</body>
</html>
